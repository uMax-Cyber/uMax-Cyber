<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0d1117" rx="12"/>
  <text x="400" y="30" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="bold">Infrastructure Architecture</text>
  <!-- Internet (pulsing) -->
  <rect x="350" y="50" width="100" height="40" fill="#1f2937" stroke="#30363d" rx="8">
    <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="75" text-anchor="middle" fill="#e6edf3" font-size="14">🌐 Internet</text>
  <!-- Animated connection lines -->
  <line x1="400" y1="90" x2="300" y2="130" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#f85149;#30363d" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="90" x2="500" y2="130" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#f85149;#30363d" dur="2s" begin="1s" repeatCount="indefinite"/>
  </line>
  <!-- Firewalls (red glow) -->
  <rect x="250" y="130" width="100" height="40" fill="#1f2937" stroke="#f85149" rx="8">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="300" y="155" text-anchor="middle" fill="#f85149" font-size="13">🔥 FW-GW1</text>
  <rect x="450" y="130" width="100" height="40" fill="#1f2937" stroke="#f85149" rx="8">
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="155" text-anchor="middle" fill="#f85149" font-size="13">🔥 FW-GW2</text>
  <!-- Connections to core -->
  <line x1="300" y1="170" x2="400" y2="210" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="500" y1="170" x2="400" y2="210" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#58a6ff;#30363d" dur="2.5s" begin="0.7s" repeatCount="indefinite"/>
  </line>
  <!-- Core switch (blue pulse) -->
  <rect x="330" y="210" width="140" height="40" fill="#1f2937" stroke="#58a6ff" rx="8">
    <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="235" text-anchor="middle" fill="#58a6ff" font-size="13">🔀 Core Switch</text>
  <!-- Connections to nodes -->
  <line x1="400" y1="250" x2="200" y2="290" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="250" x2="400" y2="290" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" dur="3s" begin="1s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="250" x2="600" y2="290" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#3fb950;#30363d" dur="3s" begin="2s" repeatCount="indefinite"/>
  </line>
  <!-- Proxmox nodes (green breathing) -->
  <rect x="130" y="290" width="140" height="50" fill="#1f2937" stroke="#3fb950" rx="8">
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="200" y="310" text-anchor="middle" fill="#3fb950" font-size="13">🖥 Proxmox Node 1</text>
  <text x="200" y="328" text-anchor="middle" fill="#8b949e" font-size="11">Firewalls + DHCP</text>
  <rect x="330" y="290" width="140" height="50" fill="#1f2937" stroke="#3fb950" rx="8">
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="310" text-anchor="middle" fill="#3fb950" font-size="13">🖥 Proxmox Node 2</text>
  <text x="400" y="328" text-anchor="middle" fill="#8b949e" font-size="11">AI Agent + Controller</text>
  <rect x="530" y="290" width="140" height="50" fill="#1f2937" stroke="#3fb950" rx="8">
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="310" text-anchor="middle" fill="#3fb950" font-size="13">🖥 Proxmox Node 3</text>
  <text x="600" y="328" text-anchor="middle" fill="#8b949e" font-size="11">Services + Storage</text>
  <!-- Monitoring (yellow radar) -->
  <circle cx="230" cy="405" r="0" fill="none" stroke="#d29922" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="0;60;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="130" y="380" width="200" height="50" fill="#1f2937" stroke="#d29922" rx="8">
    <animate attributeName="stroke" values="#d29922;#f9e2af;#d29922" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="230" y="400" text-anchor="middle" fill="#d29922" font-size="13">📊 Syslog + Monitoring</text>
  <text x="230" y="418" text-anchor="middle" fill="#8b949e" font-size="11">NightWatch + AuditForge</text>
  <!-- AI Agent (purple glow) -->
  <circle cx="570" cy="405" r="0" fill="none" stroke="#bc8cff" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="0;60;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="470" y="380" width="200" height="50" fill="#1f2937" stroke="#bc8cff" rx="8">
    <animate attributeName="stroke" values="#bc8cff;#e0c3fc;#bc8cff" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="570" y="400" text-anchor="middle" fill="#bc8cff" font-size="13">🤖 AI Agent</text>
  <text x="570" y="418" text-anchor="middle" fill="#8b949e" font-size="11">MCPForge + AgentBlueprint</text>
  <text x="100" y="470" fill="#8b949e" font-size="11" opacity="0">
    Production deployment architecture
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  </text>
</svg>
